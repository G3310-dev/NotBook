<!DOCTYPE html>
<html>

<head>
    <title>Flashcard Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .card {
            width: 300px;
            margin: auto;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            background-color: #f9f9f9;
            box-shadow: 2px 2px 10px #aaa;
        }

        input[type="text"] {
            padding: 8px;
            width: 80%;
            margin-top: 10px;
        }

        button {
            padding: 8px 16px;
            margin-top: 10px;
        }

        .feedback {
            font-weight: bold;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <h1>Flashcard Game</h1>

    <div class="card" id="card-container">
        <p id="card-question">{{ flashcards[0]['question'] }}</p>
        <input type="text" id="user-answer" placeholder="Type your answer here">
        <br>
        <button onclick="checkAnswer()">Check Answer</button>
        <p id="feedback" class="feedback"></p>
    </div>

    <div id="final-score" class="hidden">
        <h2>🎉 Game Over!</h2>
        <p>Your final score is: <strong><span id="score"></span></strong></p>
    </div>

    <script>
        const flashcards = JSON.parse('{{ flashcards | tojson | safe }}');
        let currentIndex = 0;
        let score = 0;
        const answeredCorrectly = Array(flashcards.length).fill(false);

        function updateCard() {
            if (currentIndex >= flashcards.length) {
                showFinalScore();
                return;
            }
            document.getElementById("card-question").textContent = flashcards[currentIndex].question;
            document.getElementById("user-answer").value = "";
            document.getElementById("feedback").textContent = "";
        }

        function checkAnswer() {
            const userInput = document.getElementById("user-answer").value.trim().toLowerCase();
            const correctAnswer = flashcards[currentIndex].answer.toLowerCase();
            const feedbackEl = document.getElementById("feedback");

            if (userInput === correctAnswer) {
                if (!answeredCorrectly[currentIndex]) {
                    score += 1;
                    answeredCorrectly[currentIndex] = true;
                }
                feedbackEl.textContent = "✅ Correct!";
                feedbackEl.style.color = "green";
            } else {
                feedbackEl.textContent = `❌ Incorrect. Correct answer: ${flashcards[currentIndex].answer}`;
                feedbackEl.style.color = "red";
            }

            setTimeout(() => {
                currentIndex++;
                updateCard();
            }, 1000);
        }

        function showFinalScore() {
            document.getElementById("card-container").classList.add("hidden");
            document.getElementById("score").textContent = score + " / " + flashcards.length;
            document.getElementById("final-score").classList.remove("hidden");
        }

        updateCard();
    </script>
</body>

</html>
